services:
  api:
    build: .
    container_name: coffeeshop-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      - redis

  worker:
    build: .
    container_name: coffeeshop-worker
    command: celery -A app.celeryApp worker --loglevel=info
    volumes:
      - ./app:/app/app
    env_file:
      - .env
    depends_on:
      - redis

  beat:
    build: .
    command: celery -A app.celeryApp beat --loglevel=info
    env_file:
      - .env
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    container_name: coffeeshop-redis
    ports:
      - "6379:6379"
